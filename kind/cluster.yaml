kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Oracle listener (NodePort 31521) -> 127.0.0.1:1521
      - containerPort: 31521
        hostPort: 1521
        protocol: TCP
      # Kafka external bootstrap (NodePort 30092) -> 127.0.0.1:9092
      - containerPort: 30092
        hostPort: 9092
        protocol: TCP
      # Kafka broker 0 (NodePort 30093) -> 127.0.0.1:9093
      - containerPort: 30093
        hostPort: 9093
        protocol: TCP
