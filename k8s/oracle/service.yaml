apiVersion: v1
kind: Service
metadata:
  name: oracle
spec:
  selector:
    app: oracle
  ports:
    - name: listener
      port: 1521
      targetPort: 1521
---
# Exposes the listener on the host as 127.0.0.1:1521 (see kind/cluster.yaml)
apiVersion: v1
kind: Service
metadata:
  name: oracle-external
spec:
  type: NodePort
  selector:
    app: oracle
  ports:
    - name: listener
      port: 1521
      targetPort: 1521
      nodePort: 31521
